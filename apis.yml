name: Lynas Rare Earths

description: 'Lynas Rare Earths Limited (ASX: LYC; formerly Lynas Corporation Limited, renamed November 2020) is
  a Perth-headquartered miner and processor of rare earths and the largest rare-earth producer outside China. It
  mines the Mount Weld deposit in Western Australia and operates processing facilities in Kalgoorlie and at Gebeng,
  Malaysia, producing separated rare-earth materials including NdPr and the heavy rare earths dysprosium and terbium.
  Surfaced via the API Evangelist harvest backlog (australia-apidays-2026); no public developer API is known.'

